version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: soltrader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soltrader-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: soltrader-api
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      TRADING_MODE: PAPER
      LIVE_TRADING_ENABLED: false
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-1800}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: pnpm --dir apps/api dev
    volumes:
      - ./ml/autonomous-datasets:/app/ml/autonomous-datasets
      - ./ml/autonomous-models:/app/ml/autonomous-models

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: soltrader-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    ports:
      - "3000:3000"
    command: pnpm --dir apps/web dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: soltrader-worker
    environment:
      NODE_ENV: development
      TRADING_MODE: PAPER
      LIVE_TRADING_ENABLED: false
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    depends_on:
      redis:
        condition: service_healthy
    command: pnpm --dir apps/worker dev
    volumes:
      # Autonomous ML datasets / bundles survive image rebuilds (shared with ml-trainer and api).
      - ./ml/autonomous-datasets:/app/ml/autonomous-datasets
      - ./ml/autonomous-models:/app/ml/autonomous-models

  # Web-started ML training jobs (separate process: never trades, never blocks the worker / Exit Engine).
  ml-trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml-trainer
    container_name: soltrader-ml-trainer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRADING_MODE: PAPER
      LIVE_TRADING_ENABLED: false
      # Inside Docker the database is reached on the compose network (postgres:5432), not via the host port.
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ML_PYTHON: /opt/ml-venv/bin/python
      # Node heap below mem_limit (the Python trainer runs in the same container): an OOM stays inside ml-trainer.
      NODE_OPTIONS: ${ML_TRAINER_NODE_OPTIONS:---max-old-space-size=1024}
      ML_TRAINER_TIMEOUT_MIN: ${ML_TRAINER_TIMEOUT_MIN:-120}
      ML_TRAINER_NICE: ${ML_TRAINER_NICE:-10}
      ML_TRAINER_THREADS: ${ML_TRAINER_THREADS:-1}
      # Streaming dataset preparation (bounded memory; see docs/ML_AUTONOMOUS.md "Memory")
      ML_DATASET_REPLAY_PAGE_SIZE: ${ML_DATASET_REPLAY_PAGE_SIZE:-200}
      ML_DATASET_LIVE_PAGE_SIZE: ${ML_DATASET_LIVE_PAGE_SIZE:-500}
      ML_DATASET_SORT_CHUNK_ROWS: ${ML_DATASET_SORT_CHUNK_ROWS:-25000}
    cpus: ${ML_TRAINER_CPUS:-1.0}
    mem_limit: ${ML_TRAINER_MEMORY:-2g}
    volumes:
      - ./ml/autonomous-datasets:/app/ml/autonomous-datasets
      - ./ml/autonomous-models:/app/ml/autonomous-models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
